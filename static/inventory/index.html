<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/sold/sold.css">
  <link rel="stylesheet" href="/static/inventory/inventory.css">
</head>
<body data-source="inventory">
  <header class="band">
    <div class="band-inner">
      <a class="band-home" href="/">All watchlists</a>
      <h1>Inventory</h1>
      <p class="band-sub">Gear you bought: what it cost, what you want for it, and what it made.</p>
      <div class="band-actions">
        <button type="button" class="btn-refresh" id="add">Add item</button>
      </div>
    </div>
  </header>

  <section class="inv-summary" aria-label="Totals for the items shown" aria-live="polite">
    <div class="inv-group">
      <h2>In stock</h2>
      <dl id="sum-stock"></dl>
    </div>
    <div class="inv-group">
      <h2>Sold</h2>
      <dl id="sum-sold"></dl>
    </div>
  </section>

  <form id="filters" class="sold-filters" role="search" aria-label="Filter inventory">
    <label class="sf sf-q"><span>Search</span><input type="search" name="q" placeholder="Brand, model, category, note…"></label>
    <label class="sf"><span>Status</span>
      <select name="status">
        <option value="">All</option>
        <option value="stock">In stock</option>
        <option value="forsale">For sale</option>
        <option value="notlisted">In stock, not for sale</option>
        <option value="sold">Sold</option>
      </select>
    </label>
    <label class="sf"><span>Category</span><select name="category"><option value="">All</option></select></label>
    <label class="sf"><span>Brand</span><select name="brand"><option value="">All</option></select></label>
    <label class="sf sf-date"><span>Bought from</span><input type="date" name="bfrom"></label>
    <label class="sf sf-date"><span>to</span><input type="date" name="bto"></label>
    <label class="sf sf-date"><span>Sold from</span><input type="date" name="sfrom"></label>
    <label class="sf sf-date"><span>to</span><input type="date" name="sto"></label>
    <button type="reset" class="btn-link">Clear filters</button>
  </form>

  <main class="sold-panel">
    <div class="sold-scroll">
      <table class="sold-table inv-table">
        <thead>
          <tr>
            <th data-sort="category"><button type="button">Category</button></th>
            <th data-sort="brand"><button type="button">Brand</button></th>
            <th data-sort="model"><button type="button">Model</button></th>
            <th data-sort="bought_at"><button type="button">Bought</button></th>
            <th data-sort="bought_price buy_costs extra_costs" class="num inv-stack">
              <button type="button" data-key="bought_price">Bought for</button>
              <button type="button" data-key="buy_costs" title="Costs of buying it: shipping, fees, travel">+ buy costs</button>
              <button type="button" data-key="extra_costs" title="Costs after buying: repairs, parts, setup, selling fees">+ extra costs</button>
            </th>
            <th data-sort="sell_min sell_expected sell_max" class="num inv-stack inv-plan">
              <button type="button" data-key="sell_min">Min</button>
              <button type="button" data-key="sell_expected">Expected</button>
              <button type="button" data-key="sell_max">Max</button>
            </th>
            <th data-sort="listed_at"><button type="button" title="Ticked when you started selling it; the date it went up for sale">For sale</button></th>
            <th data-sort="sold_at"><button type="button">Sold</button></th>
            <th data-sort="sold_price" class="num"><button type="button">Sold for</button></th>
            <th data-sort="profit" class="num"><button type="button" title="Sold for − bought for">Profit</button></th>
            <th data-sort="net_profit" class="num"><button type="button" title="Sold for − bought for − buy costs − extra costs">Net profit</button></th>
            <th><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <div id="note-preview" class="sold-note-preview" hidden></div>

  <dialog id="editor" class="sold-editor inv-editor">
    <form method="dialog">
      <h2 id="editor-title">Add item</h2>
      <fieldset>
        <legend>Item</legend>
        <div class="inv-grid inv-grid-3">
          <label class="sale-field"><span class="sale-label">Category</span><input name="category" list="category-options" maxlength="200"></label>
          <label class="sale-field"><span class="sale-label">Brand</span><input name="brand" list="brand-options" maxlength="200"></label>
          <label class="sale-field"><span class="sale-label">Model</span><input name="model" maxlength="300"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Buying</legend>
        <div class="inv-grid inv-grid-4">
          <label class="sale-field"><span class="sale-label">Bought on</span><input name="bought_at" type="date"></label>
          <label class="sale-field"><span class="sale-label">Bought for (Kč)</span><input name="bought_price" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="sale-field"><span class="sale-label">Buy costs (Kč)</span><input name="buy_costs" type="number" min="0" step="1" inputmode="numeric" placeholder="shipping, fees"></label>
          <label class="sale-field"><span class="sale-label">Extra costs (Kč)</span><input name="extra_costs" type="number" min="0" step="1" inputmode="numeric" placeholder="repairs, parts"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Selling price</legend>
        <div class="inv-grid inv-grid-3">
          <label class="sale-field"><span class="sale-label">Min (Kč)</span><input name="sell_min" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="sale-field"><span class="sale-label">Expected (Kč)</span><input name="sell_expected" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="sale-field"><span class="sale-label">Max (Kč)</span><input name="sell_max" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="inv-check"><input type="checkbox" name="for_sale"> For sale</label>
          <label class="sale-field"><span class="sale-label">For sale since</span><input name="listed_at" type="date"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Sale</legend>
        <div class="inv-grid inv-grid-3">
          <label class="sale-field"><span class="sale-label">Sold on</span><input name="sold_at" type="date"></label>
          <label class="sale-field"><span class="sale-label">Sold for (Kč)</span><input name="sold_price" type="number" min="0" step="1" inputmode="numeric"></label>
          <p class="inv-calc" id="editor-calc" aria-live="polite"></p>
        </div>
      </fieldset>
      <label class="sale-field sale-note"><span class="sale-label">Note</span><textarea name="note" rows="3" maxlength="10000"></textarea></label>
      <datalist id="category-options"></datalist>
      <datalist id="brand-options"></datalist>
      <p class="inv-error" id="editor-error" role="alert" hidden></p>
      <div class="sold-editor-actions">
        <button type="submit" value="save" class="btn-plain">Save</button>
        <button type="submit" value="cancel" class="btn-link" formnovalidate>Cancel</button>
        <button type="button" class="btn-quiet btn-danger" id="delete">Delete item</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span class="toast-text"></span>
    <button type="button" class="toast-undo">Undo</button>
  </div>

  <script src="/static/watchlist.js"></script>
  <script src="/static/inventory/app.js"></script>
</body>
</html>
