<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="band">
    <div class="band-inner">
      <h1>Boutique kytary</h1>
      <p class="band-sub">Your watchlist for kytary.cz boutique guitars</p>
      <div class="band-actions">
        <button id="refresh" class="btn-refresh" type="button">Check for new ads</button>
        <p id="last-run" class="last-run" aria-live="polite"></p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Lists">
    <button role="tab" id="tab-watching" aria-controls="panel" data-tab="watching" aria-selected="true">Watching <span class="count"></span></button>
    <button role="tab" id="tab-waiting" aria-controls="panel" data-tab="waiting" aria-selected="false">Waiting for price drop <span class="count"></span></button>
    <button role="tab" id="tab-ignore" aria-controls="panel" data-tab="ignore" aria-selected="false">Not watching <span class="count"></span></button>
    <button role="tab" id="tab-sold" aria-controls="panel" data-tab="sold" aria-selected="false">Sold <span class="count"></span></button>
  </nav>

  <main id="panel" role="tabpanel" class="panel"></main>

  <div id="toast" class="toast" role="status" hidden>
    <span class="toast-text"></span>
    <button type="button" class="toast-undo">Undo</button>
  </div>

  <template id="row-tpl">
    <article class="ad">
      <a class="ad-thumb" target="_blank" rel="noopener"><img alt="" loading="lazy"></a>
      <div class="ad-info">
        <h3 class="ad-name"><a target="_blank" rel="noopener"><span class="ad-brand"></span> <span class="ad-model"></span></a></h3>
        <p class="ad-meta"><span class="ad-type"></span><span class="ad-id"></span></p>
      </div>
      <div class="ad-price">
        <span class="price-now"></span>
        <span class="price-was"></span>
        <span class="ad-avail"></span>
      </div>
      <div class="ad-controls"></div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
